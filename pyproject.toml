[project]
name = "teacher-charles"
version = "0.1.0"
description = "Um professor de ingles que roda localmente na sua maquina"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # O G2P da linha de IPA que corre embaixo de toda fala (teaching/phonetics.py).
    #
    # Dependencia base, e nao do extra `voice`, porque nao e voz: entra texto,
    # sai texto, e nenhum byte de audio passa por aqui. Pendurar no extra faria
    # a transcricao sumir na instalacao que todo mundo faz -- a voz e desligada
    # por default. Sao ~21 MB (quase tudo o espeak-ng empacotado no
    # `espeakng_loader`) contra os ~400 MB do extra.
    #
    # O `kokoro-onnx` tambem depende dos dois, e isso e o que da a propriedade
    # que importa: o IPA na tela e o mesmo que a voz pronuncia.
    "phonemizer>=3.4",
    "espeakng-loader>=0.2.4",
]

[project.optional-dependencies]
# Voz da Fase 1.5. Extra, e nao dependencia base, por tres razoes: o chat por
# texto da Fase 1 funciona inteiro sem isto; sao ~400 MB de wheels
# (ctranslate2 + onnxruntime) que ninguem deveria baixar para rodar a suite; e
# `onnxruntime`/`ctranslate2` sao justamente os wheels que prendem o
# interpretador em 3.12 (plano  1.3).
#
# `faster-whisper` traz `av` (PyAV), e e ele que decodifica o webm/opus que o
# navegador grava -- por isso nao ha chamada a ffmpeg em subprocesso em
# nenhum lugar do caminho de audio.
voice = [
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
    # Teto, nao capricho: o `decode_audio` do faster-whisper 1.2 chama
    # `av.open(metadata_errors=...)`, e o PyAV 19 removeu esse argumento. Com
    # o 19 instalado, TODA transcricao estoura em TypeError no decode -- antes
    # de o modelo ver um sample. Suba o teto quando o faster-whisper soltar
    # versao que fale com a API nova.
    "av<19",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
teacher-charles = "teacher_charles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teacher_charles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A suite roda sem modelo nenhum por default. Os testes de integracao batem
# num Ollama de verdade e se pulam sozinhos quando nao ha um.
markers = [
    "integration: exercita o Ollama local de verdade (pula sem Ollama/modelo)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
